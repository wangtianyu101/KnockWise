<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>/auth · KnockWise · 单一表单自动判断（V3 glassmorphism · v4）</title>
<style>
  /* ===========================================================
   * v4 改动（用户反馈 · 2026-07-26）：
   * - 图标：logo 闪电 → V3 K logo（与 sidebar 一致）
   * - 图标：toast 文字符号 → SVG
   * - 去掉副标题（"输入邮箱开始..." / "检测到 xxx 已注册..." 等）
   * - 去掉检查状态指示器（⏳ / ● / ✓）
   * - 默认态按钮文字 → "登录 / 注册"
   * =========================================================== */

  :root {
    --color-primary: #6366f1;
    --color-primary-hover: #4f46e5;
    --color-cyan: #06b6d4;
    --color-emerald: #10b981;
    --color-bg-page: #050914;
    --color-bg-card: rgba(15, 20, 40, 0.7);
    --color-bg-card-hover: rgba(20, 26, 50, 0.85);
    --color-text-primary: #f8fafc;
    --color-text-secondary: #94a3b8;
    --color-text-tertiary: #64748b;
    --color-success: #34d399;
    --color-error: #f87171;
    --color-border: rgba(148, 163, 184, 0.08);
    --color-border-hover: rgba(99, 102, 241, 0.25);
    --shadow-glow-primary: 0 0 0 1px rgba(99, 102, 241, 0.15), 0 4px 16px rgba(99, 102, 241, 0.2);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg-page);
    color: var(--color-text-primary);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
    background-attachment: fixed;
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ============ 演示控制条 ============ */
  .demo-bar {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid var(--color-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--color-text-secondary);
    backdrop-filter: blur(8px);
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    max-width: calc(100vw - 24px);
  }
  .demo-bar button {
    background: var(--color-primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .demo-bar button:hover { background: var(--color-primary-hover); }
  .demo-bar .label { color: var(--color-text-tertiary); }

  /* ============ Logo + 标题 ============ */
  .brand-block {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-block .logo {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow-primary);
  }
  .brand-block .brand-name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #818cf8 0%, #06b6d4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  /* v4: 去掉 tagline（属于文字提示）*/
  /* .brand-block .tagline { display: none; } */

  /* ============ Glass Card ============ */
  .glass-card {
    background: var(--color-bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--color-border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-md);
    transition: all 0.3s var(--ease-out);
  }
  .glass-card:hover {
    border-color: var(--color-border-hover);
    box-shadow: var(--shadow-glow-primary);
  }

  /* v4: 卡片只有标题，无副标题 */
  .card-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 18px;
    color: var(--color-text-primary);
  }

  /* ============ Form ============ */
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .input {
    width: 100%;
    background: rgba(15, 20, 40, 0.5);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--color-text-primary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s var(--ease-out);
  }
  .input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
  }
  .input::placeholder { color: var(--color-text-tertiary); }
  .input[readonly] {
    background: rgba(15, 20, 40, 0.3);
    color: var(--color-text-secondary);
  }

  /* ============ Button（v4：默认态"登录 / 注册"） ============ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    letter-spacing: 0.02em;
    margin-top: 8px;
    transition: all 0.2s var(--ease-out);
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--color-primary), #8b5cf6);
    color: white;
    box-shadow: var(--shadow-glow-primary);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    background: linear-gradient(135deg, var(--color-primary-hover), #7c3aed);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* ============ Dev Login 折叠 ============ */
  .dev-login-section {
    width: 100%;
    max-width: 400px;
    margin-top: 16px;
    text-align: center;
  }
  .dev-login-toggle {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text-tertiary);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    transition: all 0.2s;
  }
  .dev-login-toggle:hover {
    border-color: var(--color-border-hover);
    color: var(--color-text-secondary);
  }
  .dev-login-content {
    display: none;
    margin-top: 8px;
    padding: 12px;
    background: rgba(15, 20, 40, 0.5);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 11px;
    color: var(--color-text-secondary);
    text-align: left;
  }
  .dev-login-content.show { display: block; }
  .dev-login-content code {
    color: var(--color-cyan);
    font-family: ui-monospace, monospace;
  }

  /* ============ Toast（v4：SVG 图标） ============ */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: rgba(15, 20, 40, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--color-border-hover);
    border-radius: 12px;
    padding: 12px 20px;
    box-shadow: var(--shadow-lg);
    color: var(--color-text-primary);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    min-width: 280px;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .toast.success { border-left: 3px solid var(--color-emerald); }
  .toast.error { border-left: 3px solid var(--color-error); }
  .toast svg {
    flex-shrink: 0;
  }
  .toast.success svg { color: var(--color-emerald); }
  .toast.error svg { color: var(--color-error); }

  /* ============ Dashboard 预览 ============ */
  .dashboard-preview {
    display: none;
    width: 100%;
    max-width: 800px;
    margin-top: 24px;
  }
  .dashboard-preview.show { display: block; }
  .topnav-demo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: var(--color-bg-card);
    backdrop-filter: blur(20px);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    margin-bottom: 12px;
  }
  .topnav-demo .page-title {
    font-size: 12px;
    color: var(--color-text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .topnav-demo .user-block {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topnav-demo .user-name {
    font-size: 13px;
    color: var(--color-text-primary);
  }
  .topnav-demo .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--color-primary), var(--color-cyan));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    box-shadow: var(--shadow-glow-primary);
  }
  .comparison-note {
    text-align: center;
    margin-top: 12px;
    padding: 10px;
    background: rgba(52, 211, 153, 0.08);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-radius: 8px;
    color: var(--color-success);
    font-size: 12px;
  }
  .comparison-note code {
    background: rgba(52, 211, 153, 0.15);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    color: var(--color-success);
  }

  /* ============ 响应式 ============ */
  @media (max-width: 480px) {
    .glass-card { padding: 24px; }
    .brand-block .brand-name { font-size: 26px; }
    .demo-bar { font-size: 10px; padding: 6px 8px; gap: 4px; }
    .demo-bar button { padding: 2px 6px; font-size: 10px; }
  }
</style>
</head>
<body>

<!-- 演示控制条 -->
<div class="demo-bar">
  <span class="label">演示：</span>
  <button onclick="showDefault()">默认</button>
  <button onclick="showExists()">已注册</button>
  <button onclick="showNew()">未注册</button>
  <button onclick="showSuccess()">成功</button>
  <button onclick="showError()">失败</button>
  <button onclick="showDashboard()">Header</button>
</div>

<!-- Logo + 标题（v4：tagline 隐藏） -->
<div class="brand-block">
  <div class="logo">
    <!-- V3 K logo（与 sidebar 一致） -->
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="7" fill="rgba(255,255,255,0.18)" />
      <path d="M9 7v14M9 21l11-14" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 14h6M20 14v7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    </svg>
  </div>
  <div class="brand-name">KnockWise</div>
  <!-- v4: tagline 去掉（属于文字提示） -->
</div>

<!-- ============ 状态 1：默认（按钮：登录 / 注册） ============ -->
<div class="glass-card" id="state-default">
  <h2 class="card-title">欢迎来到 KnockWise</h2>
  <form onsubmit="event.preventDefault();">
    <div class="form-group">
      <label>邮箱</label>
      <input class="input" id="default-email" type="email" placeholder="wangtianyu@example.com" autofocus
        onblur="checkEmail(this.value)">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input class="input" type="password" placeholder="••••••">
    </div>
    <!-- v4: 去掉检查状态指示器 -->
    <button class="btn btn-primary" type="submit">登录 / 注册</button>
  </form>
</div>

<!-- ============ 状态 2：邮箱已注册 ============ -->
<div class="glass-card" id="state-exists" style="display:none;">
  <h2 class="card-title">欢迎回来</h2>
  <!-- v4: 去掉副标题 -->
  <form onsubmit="event.preventDefault(); showSuccess();">
    <div class="form-group">
      <label>邮箱</label>
      <input class="input" type="email" value="wangtianyu@example.com" readonly>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input class="input" type="password" placeholder="••••••" autofocus>
    </div>
    <button class="btn btn-primary" type="submit">登 录</button>
  </form>
</div>

<!-- ============ 状态 3：邮箱未注册 ============ -->
<div class="glass-card" id="state-new" style="display:none;">
  <h2 class="card-title">加入 KnockWise</h2>
  <!-- v4: 去掉副标题 -->
  <form onsubmit="event.preventDefault(); showSuccess();">
    <div class="form-group">
      <label>邮箱</label>
      <input class="input" type="email" value="newuser@example.com" readonly>
    </div>
    <div class="form-group">
      <label>昵称（可选）</label>
      <input class="input" type="text" placeholder="你的昵称" autofocus>
    </div>
    <div class="form-group">
      <label>设置密码（≥ 6 位）</label>
      <input class="input" type="password" placeholder="••••••">
    </div>
    <button class="btn btn-primary" type="submit">注 册</button>
  </form>
</div>

<!-- Dev Login 折叠 -->
<div class="dev-login-section">
  <button class="dev-login-toggle" onclick="toggleDevLogin()">🛡 Dev Login</button>
  <div class="dev-login-content" id="dev-login-content">
    <div>邮箱：<code>dev@knockwise.local</code></div>
    <div>密码：<code>dev123</code></div>
  </div>
</div>

<!-- Dashboard 预览 -->
<div class="dashboard-preview" id="state-dashboard">
  <div class="topnav-demo">
    <div class="page-title">Dashboard</div>
    <div class="user-block">
      <span class="user-name">wangtianyu</span>
      <div class="avatar">WT</div>
    </div>
  </div>
  <div class="comparison-note">
    ✅ Header 显示 <code>wangtianyu</code>（从 JWT email 前缀注入）· 不再是 hardcode "开发者"
  </div>
</div>

<!-- Toast（v4：SVG 图标） -->
<div class="toast" id="toast">
  <span id="toast-icon"></span>
  <span id="toast-msg">注册成功 · 正在跳转 Dashboard...</span>
</div>

<script>
// SVG 图标（v4）
const ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

function showDefault() {
  hideAll();
  document.getElementById('state-default').style.display = 'block';
  hideToast();
}
function checkEmail(email) {
  if (!email || !email.includes('@')) return;
  if (email.toLowerCase().includes('new') || email.toLowerCase().includes('test')) {
    showNew(email);
  } else {
    showExists(email);
  }
}
function showExists(email) {
  hideAll();
  document.getElementById('state-exists').style.display = 'block';
  hideToast();
}
function showNew(email) {
  hideAll();
  document.getElementById('state-new').style.display = 'block';
  hideToast();
}
function showSuccess() {
  hideAll();
  document.getElementById('state-new').style.display = 'block';
  showToast('success', '创建成功 · 正在跳转 Dashboard...');
  setTimeout(() => {
    hideAll();
    document.getElementById('state-dashboard').classList.add('show');
    hideToast();
  }, 1500);
}
function showError() {
  hideAll();
  document.getElementById('state-new').style.display = 'block';
  showToast('error', '该邮箱已注册 · 请返回登录');
}
function showDashboard() {
  hideAll();
  document.getElementById('state-dashboard').classList.add('show');
  hideToast();
}
function toggleDevLogin() {
  document.getElementById('dev-login-content').classList.toggle('show');
}
function hideAll() {
  ['state-default', 'state-exists', 'state-new'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById('state-dashboard').classList.remove('show');
}
function showToast(type, msg) {
  const toast = document.getElementById('toast');
  toast.className = 'toast ' + type;
  document.getElementById('toast-icon').innerHTML = type === 'success' ? ICON_CHECK : ICON_X;
  document.getElementById('toast-msg').textContent = msg;
  toast.offsetHeight;
  toast.classList.add('show');
  if (type === 'success') setTimeout(() => hideToast(), 1500);
}
function hideToast() {
  document.getElementById('toast').classList.remove('show');
}
</script>

</body>
</html>
