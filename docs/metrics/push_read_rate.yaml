# AI 推送读完率（push_read_rate · L1 探索性）
# 决策 1 / L1 探索性标记：阈值 60% 未实测验证 · SCN-P1.8.6 硬阻断 L2 升级
# ⚠️ v1.2 修正：移除 `---` 分隔 + deadline 加引号 + L1 最小集 3 字段
metric_id: push_read_rate
metric_name: AI 推送读完率
formula: read_to_end_count / opened_count
num_event:
  name: push.read_to_end
  file: frontend/components/AIRecommendationCard.tsx
  line: 1  # 待 T6 实施后定位（暂占位）
den_event:
  name: push.opened
  file: backend/services/digest_service.py
  line: 1  # 待 T6 实施后定位（暂占位）
dedup:
  primary_key: user_id
  window: 7d
target:
  value: 0.60
  deadline: "2026-12-31"
  source: 估算（产品未上线 · 阈值未实测）
failure_action:
  - 上线 30 天后若读完率 < 30%（target 50%），重写推送摘要生成策略并做 A/B 测试
  - 调研用户阅读时长分布，定位 drop-off 点并优化内容结构与摘要长度
current_baseline: null  # L1 探索性 · 未实测
instrumentation_site: docs/metrics/push_read_rate.yaml（待 frontend 埋点接入）
owner: claude
observed_at: null  # L1 探索性 · 未观测
layer: L1  # SCN-P1.8.6 硬阻断 L2 升级

# ─── L1 最小集（v1.2 加严）───
problem_hypothesis: 用户对 AI 推送内容的完读率是否会因摘要质量提升而增加
core_signal: 推送完读率超过 60%
events:
  - name: push.opened
  - name: push.read_to_end

# 上线后维护指南：同 push_open_rate.yaml