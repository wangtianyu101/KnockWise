# AI 推送打开率（push_open_rate · L1 探索性）
# 决策 1 / L1 探索性标记：阈值 40% 未实测验证 · SCN-P1.8.6 硬阻断 L2 升级
# ⚠️ v1.2 修正：移除 `---` 分隔 · deadline 加引号 · 加 L1 最小集 3 字段（problem_hypothesis + core_signal + events）
metric_id: push_open_rate
metric_name: AI 推送打开率
formula: opened_count / delivered_count
num_event:
  name: push.opened
  file: backend/services/digest_service.py
  line: 1  # 待 T6 实施后定位（暂占位）
den_event:
  name: push.delivered
  file: backend/services/digest_service.py
  line: 1  # 待 T6 实施后定位（暂占位）
dedup:
  primary_key: user_id
  window: 7d
target:
  value: 0.40
  deadline: "2026-12-31"  # v1.2 加引号 · 强制 str · 不被 YAML 解析为 date
  source: 估算（产品未上线 · 阈值未实测）
failure_action:
  - 上线 30 天后若打开率 < 20%（target 50%），降级推送频率至每周 1 条
  - 进一步降低个性化推荐强度，专注核心场景与关键决策点的内容覆盖范围
current_baseline: null  # L1 探索性 · 未实测
instrumentation_site: docs/metrics/push_open_rate.yaml（待 T6 + T11 + T12 实施后接入 digest_metrics）
owner: claude
observed_at: null  # L1 探索性 · 未观测
layer: L1  # SCN-P1.8.6 硬阻断 L2 升级 · 阈值未验证前不固化

# ─── L1 最小集（spec § 4.2 / § 3.2 分层规则 / SCN-P1.8.5 · v1.2 加严）───
problem_hypothesis: 用户对 AI 推送的打开率是否会因内容相关性提升而显著增长
core_signal: 推送打开率超过 40%
events:
  - name: push.delivered
  - name: push.opened

# 上线后维护指南：
# 1. 跑 python3 scripts/check_metric_dict.py docs/metrics/push_open_rate.yaml · 应 exit 0（layer: L1 + L1 最小集 3 字段齐全）
# 2. 跑 python3 scripts/check_metric_dict.py docs/metrics/push_open_rate.yaml --enforce-l2 · 应 exit 1（阈值未实测 · SCN-P1.8.6 硬阻断）
# 3. 实测打开率达标后 · 改 layer: L2 + 填 current_baseline + observed_at